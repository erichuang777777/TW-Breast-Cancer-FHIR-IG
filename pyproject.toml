[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbc-review-workbench"
version = "0.1.0a1"
description = "FHIR-aligned QBC breast cancer conversion and human review workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  "openpyxl>=3.1",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "requests>=2.31",
  # 癌登代碼表與雙向編解碼引擎（14 癌別，逐碼驗證）
  "tcr-decoder @ git+https://github.com/erichuang777777/TCRD_decoding.git",
]

[project.scripts]
qbc-workbench = "qbc_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["qbc_workbench*", "tcr_workbench*"]

[tool.setuptools.package-data]
qbc_workbench = ["data/*.json"]
tcr_workbench = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
