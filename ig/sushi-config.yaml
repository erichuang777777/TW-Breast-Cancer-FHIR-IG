id: io.github.erichuang777777.breast-cancer
canonical: https://erichuang777777.github.io/TW-Breast-Cancer-FHIR-IG
name: BreastCancerCommunityImplementationGuide
title: 乳癌 FHIR 實作指引－社群草稿
description: 非官方乳癌 FHIR 社群草稿，以 TW Core IG 1.0.0 為結構基礎，提供可重用的乳癌共同資料層，並納入癌症診療計畫書、QBC／P4P 與官方 TWPAS 投影等平行 Task。mCODE 4.0.0 與 ICHOM Breast Cancer 1.0.0 僅作語意參考；TWPAS 輸出以健保署官方 IG 為唯一規範。本 IG 非衛生福利部、中央健康保險署、HL7 International 或 ICHOM 出版品。
status: draft
experimental: true
version: 1.0.0-preview.1
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: preview
license: CC-BY-4.0
jurisdiction: urn:iso:std:iso:3166#TW
copyright: >-
  本 IG 之原創內容依 CC BY 4.0 授權。所引用之健保署／衛福部規格文件、HL7 FHIR、
  TW Core IG、mCODE、ICHOM、UCUM、ISO 3166 等第三方著作與商標，其權利仍屬各該權利人所有，
  不因本 IG 之授權而改變。本 IG 未經上述任何機構認可或背書。

